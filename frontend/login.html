<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Movie Manager — Login</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="auth-page">
    <main class="auth-container">
      <section class="auth-card">
        <div class="brand">
          <div class="brand-icon">🎬</div>

          <div>
            <h1>Movie Manager</h1>
            <p>Your personal movie library</p>
          </div>
        </div>

        <div class="auth-heading">
          <h2>Welcome back</h2>
          <p>Sign in to manage your movie collection.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username"> Username </label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-full"
            id="loginButton"
          >
            Sign In
          </button>
        </form>

        <div class="auth-divider">
          <span>New here?</span>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="registerUsername"> Create Username </label>

            <input
              type="text"
              id="registerUsername"
              placeholder="Choose a username"
              required
            />
          </div>

          <div class="form-group">
            <label for="registerPassword"> Create Password </label>

            <input
              type="password"
              id="registerPassword"
              placeholder="At least 6 characters"
              required
            />
          </div>

          <button
            type="submit"
            class="btn btn-secondary btn-full"
            id="registerButton"
          >
            Create Account
          </button>
        </form>

        <p id="authMessage" class="auth-message"></p>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
